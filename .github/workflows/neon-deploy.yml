
name: Neon Deploy Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neon:
    name: Preview Neon Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preview Neon configuration
        run: |
          npx --yes neon@latest config plan \
            --project-id dawn-sun-28420940 \
            --branch production
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
